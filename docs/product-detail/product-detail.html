<section class="product-detail">
  <figure class="product-detail__gallery">
    <div class="product-detail__thumbnails">
      <img src="assets/images/one-life-t-shirt/pic-one-life-t-shirt-1.png"
        class="product-detail__thumbnail product-detail__thumbnail--active" alt="Thumbnail 1" title="Thumbnail 1" />
      <img src="assets/images/one-life-t-shirt/pic-one-life-t-shirt-2.png" class="product-detail__thumbnail"
        alt="Thumbnail 2" title="Thumbnail 2" />
      <img src="assets/images/one-life-t-shirt/pic-one-life-t-shirt-3.png" class="product-detail__thumbnail"
        alt="Thumbnail 3" title="Thumbnail 3" />
    </div>
    <div class="product-detail__main-image">
      <img id="js-main-image" src="assets/images/one-life-t-shirt/pic-one-life-t-shirt-1.png" alt="Main Product"
        title="Main Product" />
    </div>
  </figure>

  <div class="product-detail__info">
    <div class="product-card product-card--detail">
      <h1 class="product-card__name">One Life Graphic T-Shirt</h1>

      <div class="product-card__rating">
        <div class="rating">
          <span class="rating__star"></span>
          <span class="rating__star"></span>
          <span class="rating__star"></span>
          <span class="rating__star"></span>
          <span class="rating__star--half"></span>
        </div>
        <p class="product-card__rating-text">
          4.5<span class="product-card__rating-text--muted">/5</span>
        </p>
      </div>

      <div class="product-card__price">
        <span class="product-card__price--current">$260</span>
        <span class="product-card__price--old">$300</span>
        <span class="product-card__price--discount">-40%</span>
      </div>
    </div>

    <p class="product-detail__description">
      This graphic t-shirt which is perfect for any occasion. Crafted from
      a soft and breathable fabric, it offers superior comfort and style.
    </p>

    <form class="product-detail__form" id="js-add-to-cart-form">
      <div class="product-detail__variant">
        <span class="product-detail__variant-label">Select Colors</span>
        <div class="color-selector">
          <input type="radio" name="color" id="color-1" value="green" checked class="color-selector__input" />
          <label for="color-1" class="color-selector__label" style="background-color: #4f4631"></label>

          <input type="radio" name="color" id="color-2" value="green-dark" class="color-selector__input" />
          <label for="color-2" class="color-selector__label" style="background-color: #314f4a"></label>

          <input type="radio" name="color" id="color-3" value="purple" class="color-selector__input" />
          <label for="color-3" class="color-selector__label" style="background-color: #31344f"></label>
        </div>
      </div>

      <div class="product-detail__variant">
        <span class="product-detail__variant-label">Choose Size</span>
        <div class="size-selector">
          <input type="radio" name="size" id="size-sm" value="Small" class="size-selector__input" />
          <label for="size-sm" class="size-selector__label">Small</label>

          <input type="radio" name="size" id="size-md" value="Medium" checked class="size-selector__input" />
          <label for="size-md" class="size-selector__label">Medium</label>

          <input type="radio" name="size" id="size-lg" value="Large" class="size-selector__input" />
          <label for="size-lg" class="size-selector__label">Large</label>

          <input type="radio" name="size" id="size-xl" value="X-Large" class="size-selector__input" />
          <label for="size-xl" class="size-selector__label">X-Large</label>
        </div>
      </div>

      <div class="product-detail__actions">
        <div class="product-detail__quantity">
          <button type="button" class="btn btn--qty-btn js-qty-decrease">
            -
          </button>
          <input type="number" class="product-detail__qty-input js-qty-input" value="1" min="1" />
          <button type="button" class="btn btn--qty-btn js-qty-increase">
            +
          </button>
        </div>
        <button type="submit" class="btn btn--add-to-cart js-add-to-cart">
          Add to Cart
        </button>
      </div>
    </form>
  </div>
</section>
