<div class="cart__summary">
  <aside class="cart-summary">
    <h2 class="cart-summary__title">Order Summary</h2>
    <ul class="cart-summary__list">
      <li class="cart-summary__item">
        <span class="cart-summary__label">Subtotal</span>
        <span class="cart-summary__value"></span>
      </li>
      <!-- <li class="cart-summary__item cart-summary__item--discount">
                <span class="cart-summary__label">Discount</span>
                <span class="cart-summary__value"></span>
              </li> -->
      <li class="cart-summary__item">
        <span class="cart-summary__label">Delivery Fee</span>
        <span class="cart-summary__value"></span>
      </li>
    </ul>
    <div class="cart-summary__total">
      <span class="cart-summary__label">Total</span>
      <span class="cart-summary__value"></span>
    </div>
    <form class="cart-summary__promo">
      <div class="cart-summary__promo-input-wrapper">
        <input type="text" class="cart-summary__promo-input" placeholder="Add promo code" />
      </div>
      <button type="submit" class="btn btn--apply">Apply</button>
    </form>
    <button class="btn btn--add-to-cart cart-summary__checkout">
      Go to Checkout
      <span class="cart-summary__checkout-arrow">&#8594;</span>
    </button>
  </aside>
</div>
